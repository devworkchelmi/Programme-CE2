services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/carnet-ce2:cached
      # var/cache et var/log sur des volumes Docker natifs plutôt que sur le bind mount
      # Windows/OneDrive : Symfony en mode dev réécrit énormément de petits fichiers de
      # cache à chaque requête, et faire transiter ça par le partage de fichiers hôte
      # (a fortiori dans un dossier synchronisé OneDrive) est ce qui rend le rechargement
      # extrêmement lent. Ici ces écritures restent dans la VM Linux de Docker.
      - var_cache:/var/www/carnet-ce2/var/cache
      - var_log:/var/www/carnet-ce2/var/log
    depends_on:
      - database
    environment:
      APP_ENV: dev

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/carnet-ce2:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: carnet_ce2
      MARIADB_USER: carnet_ce2
      MARIADB_PASSWORD: carnet_ce2
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  database_data:
  var_cache:
  var_log:
