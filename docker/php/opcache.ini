; Réglages OPcache pour accélérer le rechargement en dev (cf. README §Performance).
; validate_timestamps reste à 1 pour que les modifications de code soient bien prises
; en compte sans redémarrer le conteneur ; revalidate_freq=0 vérifie à chaque requête
; mais évite de recompiler les fichiers non modifiés grâce à un cache assez grand pour
; contenir tout vendor/ + src/ (max_accelerated_files).
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Cache des chemins réels (realpath) : réduit les appels stat() du système de fichiers,
; particulièrement coûteux sur un volume monté (bind mount) sous Windows.
realpath_cache_size=4096K
realpath_cache_ttl=600
