security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: adulte_suivi
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                path: /
                always_remember_me: false
            logout:
                path: app_logout
                target: app_login

    # Un seul compte adulte pour le MVP : tout, sauf la page de connexion, exige d'être authentifié.
    # L'espace enfant n'a pas de compte séparé — il est accessible une fois l'adulte connecté (cf. Product Specification §0)
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADULTE }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
